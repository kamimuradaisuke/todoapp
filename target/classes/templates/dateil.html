<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"></meta>
<title>タスク詳細</title>

<link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

<style>
body{
    margin:20px;
}

.area{
    width:600px;
}

.memo{
    height:150px;
}
</style>

</head>
<body>

<div class="area">

    <h1><b>TodoList</b></h1>

    <form th:action="@{/update}" method="post">

        <input type="hidden"
               name="taskId"
               th:value="${todo.taskId}">

        <div class="form-group">
            <label>タスク名</label>

            <input type="text"
                   class="form-control"
                   name="taskName"
                   th:value="${todo.taskName}">
        </div>

        <div class="form-group">

            <label>優先度</label>
            <br>

            <input type="radio"
                   name="priorityId"
                   value="1"
                   th:checked="${todo.priorityId == 1}">
            高

            <input type="radio"
                   name="priorityId"
                   value="2"
                   th:checked="${todo.priorityId == 2}">
            中

            <input type="radio"
                   name="priorityId"
                   value="3"
                   th:checked="${todo.priorityId == 3}">
            低

        </div>

        <div class="form-group">

            <label>カテゴリ</label>

            <select class="form-control"
                    name="categoryId">

                <option value="1"
                    th:selected="${todo.categoryId == 1}">
                    仕事
                </option>

                <option value="2"
                    th:selected="${todo.categoryId == 2}">
                    趣味
                </option>

                <option value="3"
                    th:selected="${todo.categoryId == 3}">
                    家事
                </option>

            </select>

        </div>

        <div class="form-group">

            <label>実施予定日</label>

            <input type="date"
                   class="form-control"
                   name="scheduledWorkDate"
                   th:value="${todo.scheduledWorkDate}">
        </div>

        <div class="form-group">

            <label>メモ</label>

            <textarea
                class="form-control memo"
                name="memo"
                th:text="${todo.memo}">
            </textarea>

        </div>

        <button type="button"
                class="btn btn-secondary"
                onclick="location.href='/'">
            戻る
        </button>

        <button type="submit"
                class="btn btn-primary">
            更新
        </button>

    </form>

</div>

</body>
</html>
