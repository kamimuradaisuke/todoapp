<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>TodoList</title>

<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

<style>

body{
	margin:20px;
}


.table th{
	border:none;
}

.table td{
	border:none;
}


</style>

</head>

<body>

<div class="todo-area">

	<h1><b>TodoList</b></h1>

	<h2><b>マイタスク</b></h2>

	<table class="table">

		<thead>
			<tr>
				<th>状態</th>
				<th>タスク</th>
				<th>優先度</th>
				<th>カテゴリ</th>
				<th>実施予定日</th>
				<th>詳細</th>
			</tr>
		</thead>

		<tbody>

			<tr th:each="todo : ${todos}">
				<td>
					<input type="checkbox">
				</td>

				<td th:text="${todo.taskName}"></td>

				<td th:text="${todo.priorityId}"></td>

				<td th:text="${todo.categoryId}"></td>

				<td th:text="${todo.scheduledWorkDate}"></td>

				<td>
					<a href="#">詳細</a>
				</td>
			</tr>

		</tbody>

	</table>


	<div class="done-area">

		<h4>
			完了済みタスク
		</h4>


	</div>

	<button
	    type="button"
	    class="btn btn-primary"
	    data-toggle="modal"
	    data-target="#addModal">
	    追加
	</button>

	<button class="btn btn-outline-secondary">
		完了済みを削除
	</button>

</div>
<div class="modal fade" id="addModal">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">
                <h5>タスク追加</h5>
            </div>

            <div class="modal-body">

                <form id="addForm">

                    <div class="form-group">
                        <label>タスク名</label>
                        <input type="text"
                               name="taskName"
                               class="form-control">
                    </div>

                    <div class="form-group">
                        <label>優先度</label>
                        <select name="priorityId"
                                class="form-control">
                            <option value="1">高</option>
                            <option value="2">中</option>
                            <option value="3">低</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>カテゴリ</label>
                        <select name="categoryId"
                                class="form-control">
                            <option value="1">仕事</option>
                            <option value="2">趣味</option>
                            <option value="3">家事</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>実施予定日</label>
                        <input type="date"
                               name="scheduledWorkDate"
                               class="form-control">
                    </div>

                    <div class="form-group">
                        <label>メモ</label>
                        <textarea name="memo"
                                  class="form-control"></textarea>
                    </div>

                </form>

            </div>

            <div class="modal-footer">

                <button
                    class="btn btn-secondary"
                    data-dismiss="modal">
                    閉じる
                </button>

                <button
                    id="addBtn"
                    class="btn btn-primary">
                    登録
                </button>

            </div>

        </div>

    </div>

</div>
</body>
</html>
