<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>TodoList</title>

<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

<style>

body{
	margin:20px;
}


.table th{
	border:none;
}

.table td{
	border:none;
}


</style>

</head>

<body>

<div class="todo-area">

	<h1><b>TodoList</b></h1>

	<h2><b>マイタスク</b></h2>

	<table class="table">

		<thead>
			<tr>
				<th>状態</th>
				<th>タスク</th>
				<th>優先度</th>
				<th>カテゴリ</th>
				<th>実施予定日</th>
			</tr>
		</thead>

		<tbody>

			<tr th:each="todo : ${todos}"
			th:if="${todo.doneFlg == 0}">
				<td>
					<form th:action="@{/done}" method="post">

					       <input type="hidden"
					              name="taskId"
					              th:value="${todo.taskId}">

					       <input type="checkbox"
					              onchange="this.form.submit()">

					   </form>

				</td>

				<td th:text="${todo.parentId != null ? 
					'L '+ todo.taskName : todo.taskName}">
				</td>

				<td th:switch="${todo.priorityId}">
					<span th:case="1">高</span>
					<span th:case="2">中</span>
					<span th:case="3">低</span>
				</td>
				
				<td th:switch="${todo.categoryId}">
					<span th:case="1">仕事</span>
					<span th:case="2">趣味</span>
					<span th:case="3">家事</span>
					<span th:case="4">学習</span>
				</td>
				<td th:text="${todo.scheduledWorkDate}">
				</td>
				<td>
				    <a th:href="@{/detail(taskId=${todo.taskId})}"
				       class="btn btn-sm btn-info">
				        詳細
				    </a>
				</td>

				<td>
				        <a th:href="@{'/tasks/' + ${todo.taskId}}"></a>
				</tr>


		</tbody>

	</table>


	<div class="done-area">
		
		<h4>
		    <button class="btn btn-link"
		            type="button"
		            data-toggle="collapse"
		            data-target="#doneList">
		        ▼ 完了済みタスク
		        (<span th:text="${doneCount}"></span>件)
		    </button>
		</h4>
		
		<div id="doneList"class="collapse">

	    <table class="table">
			
			<thead>
			        <tr>
			            <th>状態</th>
			            <th>タスク</th>
			            <th>優先度</th>
			            <th>カテゴリ</th>
			            <th>実施予定日</th>
			        </tr>
			    </thead>

	        <tbody>

	            <tr th:each="todo : ${todos}"
	                th:if="${todo.doneFlg == 1}">

					<td>

					    <form th:action="@{/undone}" method="post">

					        <input type="hidden"
					               name="taskId"
					               th:value="${todo.taskId}">

					        <input type="checkbox"
					               checked
					               onchange="this.form.submit()">

					    </form>

					</td>

	                <td th:text="${todo.parentId != null ?
	                    'L ' + todo.taskName : todo.taskName}">
	                </td>

	                <td th:switch="${todo.priorityId}">
	                    <span th:case="1">高</span>
	                    <span th:case="2">中</span>
	                    <span th:case="3">低</span>
	                </td>

	                <td th:switch="${todo.categoryId}">
	                    <span th:case="1">仕事</span>
	                    <span th:case="2">趣味</span>
	                    <span th:case="3">家事</span>
	                    <span th:case="4">学習</span>
	                </td>
					<td th:text="${todo.scheduledWorkDate}">
	                </td>

	            </tr>

	        </tbody>

	    </table>
		</div>

	</div>

	<div class="d-flex align-items-center">

	    <button
	        type="button"
	        class="btn btn-primary mr-2"
	        data-toggle="modal"
	        data-target="#addModal">
	        追加
	    </button>

	    <form th:action="@{/deleteComplete}" method="post">

	        <button
	            type="submit"
	            class="btn btn-outline-secondary">
	            完了済みを削除
	        </button>

	    </form>

	</div>
<div class="modal fade"
	id="addModal"
	tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">
                <h5>タスク追加</h5>
            </div>

            <div class="modal-body">

                <form id="subTaskForm"
					th:action="@{/addSubTask}"
					method="post">

                    <div class="form-group">
                        <label>タスク名</label>
                        <input type="text"
                               name="taskName"
                               class="form-control"
							   required>
                    </div>

                    <div class="form-group">
                        <label>優先度</label>
                        <select name="priorityId"
                                class="form-control">
                            <option value="1">高</option>
                            <option value="2">中</option>
                            <option value="3">低</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>カテゴリ</label>
                        <select name="categoryId"
                                class="form-control">
                            <option value="1">仕事</option>
                            <option value="2">趣味</option>
                            <option value="3">家事</option>
							<option value="4">学習</option>
							
                        </select>
                    </div>

                    <div class="form-group">
                        <label>実施予定日</label>
                        <input type="date"
                               name="scheduledWorkDate"
                               class="form-control">
                    </div>

                    <div class="form-group">
                        <label>メモ</label>
                        <textarea name="memo"
                                  class="form-control"></textarea>
                    </div>

                </form>

            </div>

            <div class="modal-footer">

                <button
                    class="btn btn-secondary"
                    data-dismiss="modal">
                    閉じる
                </button>

                <button
                   type="submit"
				   form="addForm"
				   class="btn btn-primary">
                    登録
                </button>

            </div>

        </div>

    </div>

</div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js">
	
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js">
	
</script>

</body>
</html>
