<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>子タスク詳細</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

<style>

.detail-box{
    width:900px;
    margin:20px auto;
    padding:20px;
}

.memo-area{
    width:100%;
    height:300px;
    resize:none;
}

</style>

</head>
<body>

<div class="detail-box">

    <h1><b>TodoList</b></h1>

    <h3>子タスク詳細</h3>

	<form action="/updateSubTask" method="post">

        <input type="hidden"
               name="taskId"
               th:value="${todo.taskId}">

        <input type="hidden"
               name="parentId"
               th:value="${todo.parentId}">

        <div class="text-right mb-3">

            <a th:href="@{/detail(taskId=${todo.parentId})}"
               class="btn btn-secondary">
                戻る
            </a>

            <button type="submit"
                    class="btn btn-primary">
                保存
            </button>

        </div>

        <!-- 親タスク名 -->
        <div class="form-group">
            <label>親タスク名</label>

            <input type="text"
                   class="form-control"
                   th:value="${parentTask.taskName}"
                   readonly>
        </div>
		

        <div class="form-row">

            <!-- 状態 -->
            <div class="col-md-1">
                <label>状態</label>

				<div>
					<input type="hidden"
					       name="taskId"
					       th:value="${todo.taskId}">
			  

					<input type="checkbox"
					       name="doneFlg"
						   value="1"
					       th:checked="${todo.doneFlg == 1}">
				    <input type="hidden"
					       name="doneFlg"
					       value="0">

				</div>
            </div>

            <!-- タスク名 -->
            <div class="col-md-3">
                <label>タスク名</label>

                <input type="text"
                       class="form-control"
                       name="taskName"
                       th:value="${todo.taskName}"
					   required
					   oninvalid="this.setCustomValidity('タスク名を入力してください')"
					   oninput="this.setCustomValidity('')">
					                      
            </div>

            <!-- 優先度 -->
            <div class="col-md-2">
                <label>優先度</label>

                <select class="form-control"
                        name="priorityId">

                    <option value="1"
                    th:selected="${todo.priorityId == 1}">
                        高
                    </option>

                    <option value="2"
                    th:selected="${todo.priorityId == 2}">
                        中
                    </option>

                    <option value="3"
                    th:selected="${todo.priorityId == 3}">
                        低
                    </option>

                </select>
            </div>

            <!-- カテゴリ -->
            <div class="col-md-2">
                <label>カテゴリ</label>

                <select class="form-control"
                        name="categoryId">

                    <option value="1"
                    th:selected="${todo.categoryId == 1}">
                        仕事
                    </option>

                    <option value="2"
                    th:selected="${todo.categoryId == 2}">
                        趣味
                    </option>

                    <option value="3"
                    th:selected="${todo.categoryId == 3}">
                        家事
                    </option>

                    <option value="4"
                    th:selected="${todo.categoryId == 4}">
                        学習
                    </option>

                </select>
            </div>

            <!-- 実施予定日 -->
            <div class="col-md-3">
                <label>実施予定日</label>

                <input type="date"
                       class="form-control"
                       name="scheduledWorkDate"
                       th:value="${todo.scheduledWorkDate}">
            </div>

        </div>

        <!-- メモ -->
        <div class="mt-4">

            <label>メモ</label>

            <textarea
                class="form-control memo-area"
                name="memo"
                th:text="${todo.memo}">
            </textarea>

        </div>

    </form>

</div>

</body>
</html>
