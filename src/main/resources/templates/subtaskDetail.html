<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>子タスク詳細</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" th:href="@{/css/style.css}">

</head>
<body>

<div class="detail-box">

    <h1><b>TodoList</b></h1>

    <h3>子タスク詳細</h3>

<form action="/updateSubTask"	method="post"th:object="${todo}"enctype="multipart/form-data">


	<input type="hidden"
		name="taskId"
        th:value="${todo.taskId}">

	<input type="hidden"
    	name="parentId"
        th:value="${todo.parentId}">

	<div class="text-right mb-3 detail-buttons">

    <a th:href="@{/detail(taskId=${todo.parentId})}"
    	class="btn btn-secondary">
        戻る
    </a>

	<button type="submit"
        class="btn btn-primary">
		保存
	</button>

</div>

<div class="form-group">
	<label>親タスク名</label>

	<input type="text"
    	class="form-control"
        th:value="${parentTask.taskName}"
        readonly>
</div>
		

<div class="form-row">

	<div class="col-md-1">
    <label>状態</label>

	<div>
		<input type="hidden"
	       name="taskId"
	       th:value="${todo.taskId}">
			  

		<input type="checkbox"
	       name="doneFlg"
		   value="1"
	       th:checked="${todo.doneFlg == 1}">
	    <input type="hidden"
	       name="doneFlg"
	       value="0">

	</div>
</div>

<div class="col-md-3">
<label>タスク名</label>

	<input type="text"
    	class="form-control"
		name="taskName"
		th:value="${todo.taskName}"
		required
		oninvalid="this.setCustomValidity('タスク名を入力してください')"
		oninput="this.setCustomValidity('')">
					                      
</div>

<div class= "col-md-1">
	<label>優先度</label>
	<select name="priorityId"
		class="form-control">
		<option th:each="p : ${priorityList}"
			th:value="${p.priorityId}"
			th:text="${p.priorityName}"
			th:selected="${p.priorityId == todo.priorityId}">
		</option>
	</select>
</div>

			  <div class="col-md-1">
			   	<label>カテゴリ</label>
			    <select name="categoryId"
			        class="form-control">
			        <option th:each="c : ${catgoryList}"
						th:value="${c.categoryId}"
						th:text="${c.categoryName}"
						th:selected="${c.categoryId == todo.categoryId}">
					</option>
				</select>
			  </div>

            <div class="col-md-3">
                <label>実施予定日</label>

                <input type="date"
                       class="form-control"
                       name="scheduledWorkDate"
                       th:value="${todo.scheduledWorkDate}">
            </div>

        </div>
		<div class="col-md-3 file-area">
		    <label>添付ファイル追加</label>

		    <input
		        type="file"
		        name="files"
		        multiple
		        class="form-control-file">
		</div>
		<div class="col-md-3 file-area">
				    <label>
				        添付ファイル
				        (<span th:text="${#lists.size(fileList)}">0</span>件)
				    </label>

				    <table class="table table-sm">
				        <tr th:each="file : ${fileList}">
				            <td style="width:70%;">
				                📄 <span th:text="${file.fileName}"></span>
				            </td>
				            <td>
				                <a th:href="@{/download(fileId=${file.fileId})}"
				                   class="btn btn-sm btn-primary">
				                    ダウンロード
				                </a>
				            </td>
				        </tr>

				        <tr th:if="${#lists.isEmpty(fileList)}">
				            <td colspan="2">
				                添付ファイルはありません
				            </td>
				        </tr>
				    </table>
				</div>

        <!-- メモ -->
		<div class="form-group">
		    <label>メモ</label>
		    <textarea th:field="*{memo}"
		              class="form-control"
		              rows="5"></textarea>
		</div>

    </form>

</div>

</body>
</html>
